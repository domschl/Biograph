[project]
name = "biograph-sensor-devproject"
version = "0.3.0"
description = "Biograph development project sensor — scans local git repositories (README, recent commits, and uncommitted IDE edits) and sends dev-project events to Biograph"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27.0",
]

[project.scripts]
biograph-sensor-devproject = "biograph_sensor_devproject.sensor:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["biograph_sensor_devproject"]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
