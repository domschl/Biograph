[project]
name = "biograph-sensor-shell"
version = "0.2.2"
description = "Biograph unified shell history sensor — watches ~/.bash_history and ~/.zsh_history and sends shell-cmd events to the backend"
requires-python = ">=3.12"
dependencies = [
    "watchdog>=4.0.0",
    "httpx>=0.27.0",
]

[project.scripts]
biograph-sensor-shell = "biograph_sensor_shell.sensor:main"
biograph-sensor-zsh = "biograph_sensor_shell.sensor:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["biograph_sensor_shell"]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "respx>=0.22.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.pyrefly]
project_includes = ["biograph_sensor_shell", "tests"]
python_version = "3.12"
