[project]
name = "biograph-cli"
version = "0.1.1"
description = "Biograph command-line logger and query tool"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.15.0",
    "httpx>=0.27.0",
    "rich>=13.0.0",
]

[project.scripts]
bio = "biograph_cli.bio:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["biograph_cli"]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "respx>=0.22.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.pyrefly]
project_includes = ["biograph_cli", "tests"]
python_version = "3.12"
