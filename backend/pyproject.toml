[project]
name = "biograph-backend"
version = "0.2.3"
description = "Biograph personal life-logging backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "sqlmodel>=0.0.21",
    "aiosqlite>=0.20.0",
    "alembic>=1.14.0",
    "greenlet>=3.0.0",
]

[project.scripts]
biograph-server = "biograph.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["biograph"]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.pyrefly]
project_includes = ["biograph", "tests"]
python_version = "3.12"
