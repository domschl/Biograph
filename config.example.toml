# Biograph — example server configuration
# Copy to config.toml and edit before starting the server.

[server]
host    = "127.0.0.1"   # bind address (use 0.0.0.0 to expose on the network)
port    = 8000
token   = "change-me"   # shared secret — change this!
db_path = "biograph.db" # path to the SQLite database file

[tls]
enabled  = false
certfile = ""            # path to TLS certificate (PEM)
keyfile  = ""            # path to TLS private key (PEM)

[resources]
# Define machine-specific paths here to resolve relative URIs
# photos = "/path/to/my/photos"
# ebooks = "/path/to/my/ebooks"

[devproject]
# Directories scanned by biograph-sensor-devproject for active git repositories & wiki notes
# roots = ["~/Source", "~/gith", "~/Projects"]
# notes_roots = ["~/Docs/Wiki/Notes"]
# notes_exclude_dirs = ["Personal", "Diary", "Templates"]
# lookback_days = 14
# max_depth = 4
# poll_interval_minutes = 30
