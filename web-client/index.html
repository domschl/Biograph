<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Biograph</title>
  <meta name="description" content="Personal life-logging timeline — browse, search and explore your life events.">
  <meta name="color-scheme" content="dark">

  <!-- Favicons -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="favicon-192x192.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">

  <!-- Preconnect for Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">

  <!-- ── Sidebar ──────────────────────────────────────────── -->
  <aside class="sidebar" role="navigation" aria-label="Main navigation">
    <div class="logo" aria-label="Biograph">Biograph</div>

    <nav class="nav-list">
      <a class="nav-link active" href="#timeline" data-view="timeline" aria-current="page">
        <svg class="nav-icon" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
          <circle cx="9" cy="9" r="7"/>
          <path d="M9 5v4.5l3 1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Timeline
      </a>
      <a class="nav-link" href="#search" data-view="search">
        <svg class="nav-icon" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
          <circle cx="8" cy="8" r="5"/>
          <path d="M13 13l2.5 2.5" stroke-linecap="round"/>
        </svg>
        Search
      </a>
      <a class="nav-link" href="#stats" data-view="stats">
        <svg class="nav-icon" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
          <path d="M2.5 15.5h13M4 11.5v4M8.5 7.5v8M13 3.5v12" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Stats
      </a>
      <a class="nav-link" href="#tags" data-view="tags">
        <svg class="nav-icon" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
          <path d="M3.5 9.5l6-6 5.5 5.5-6 6-5.5-5.5z M6.5 6.5h.01" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Tags
      </a>
      <a class="nav-link" href="#settings" data-view="settings">
        <svg class="nav-icon" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
          <circle cx="9" cy="9" r="2.8"/>
          <path d="M9 1.5v2M9 14.5v2M1.5 9h2M14.5 9h2M3.7 3.7l1.4 1.4M12.9 12.9l1.4 1.4M3.7 14.3l1.4-1.4M12.9 5.1l1.4-1.4" stroke-linecap="round"/>
        </svg>
        Settings
      </a>
    </nav>

    <div class="sidebar-footer">
      <div class="connection-badge">
        <div class="conn-dot" id="conn-dot"></div>
        <span id="conn-label" aria-live="polite">Checking…</span>
      </div>
    </div>
  </aside>

  <!-- ── Main content ─────────────────────────────────────── -->
  <main id="main" role="main" aria-live="polite" aria-atomic="false">
    <!-- Populated by app.js -->
  </main>

</div>

<script type="module" src="app.js"></script>
</body>
</html>
