<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <style>
      :root {
        --node-fill: #ffffff;
      }
      @media (prefers-color-scheme: light) {
        :root {
          --node-fill: #07090f;
        }
      }
      .edge {
        stroke: url(#g);
        stroke-width: 2.8;
        stroke-linecap: round;
        stroke-linejoin: round;
        fill: none;
      }
      .node {
        fill: var(--node-fill);
        stroke: url(#g);
        stroke-width: 2;
      }
    </style>
  </defs>
  <!-- B-shape network graph -->
  <path class="edge" d="M 9,7 L 9,25" />
  <path class="edge" d="M 9,7 C 25,7 25,16 9,16" />
  <path class="edge" d="M 9,16 C 28,16 28,25 9,25" />
  
  <!-- Graph Nodes -->
  <circle class="node" cx="9" cy="7" r="2.8" />
  <circle class="node" cx="9" cy="16" r="2.8" />
  <circle class="node" cx="9" cy="25" r="2.8" />
  <circle class="node" cx="21" cy="11.5" r="2.8" />
  <circle class="node" cx="23.25" cy="20.5" r="2.8" />
</svg>
